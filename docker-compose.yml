version: '3.8'

services:
  server:
    build: .
    container_name: melodia-server
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - melodia-network
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  mysql:
    image: mysql:8.0
    container_name: melodia-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT}:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - melodia-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s

networks:
  melodia-network:
    driver: bridge

volumes:
  mysql_data:
